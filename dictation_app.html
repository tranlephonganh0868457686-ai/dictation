        // Parser function to convert raw text to structured sentences
        function parseTranscript(raw) {
            const lines = raw.split('\n');
            const data = [];
            const timeRegex = /^(\d{2}):(\d{2}):(\d{2})\.(\d{3})\s+(.*)/;

            let tempData = [];
            for (let line of lines) {
                const match = line.match(timeRegex);
                if (match) {
                    const h = parseInt(match[1]), m = parseInt(match[2]), s = parseInt(match[3]), ms = parseInt(match[4]);
                    const timeInSeconds = h * 3600 + m * 60 + s + ms / 1000;
                    const text = match[5].trim();
                    if (text !== "No text" && !text.startsWith("(")) { // Ignore "No text" and tags like (Laughter)
                        tempData.push({ start: timeInSeconds, text: text, end: 0 });
                    }
                }
            }

            // Calculate end times based on next segment start
            for (let i = 0; i < tempData.length - 1; i++) {
                tempData[i].end = tempData[i + 1].start;
            }
            if (tempData.length > 0) {
                tempData[tempData.length - 1].end = tempData[tempData.length - 1].start + 3; // Fallback for last item
            }

            // Merge short segments to make dictation chunks reasonable (aim for 5-10s chunks)
            let mergedData = [];
            let currentChunk = null;
            
            for (let item of tempData) {
                if (!currentChunk) {
                    currentChunk = { ...item };
                } else {
                    let duration = item.end - currentChunk.start;
                    // If current chunk is too short (< 4s) or text is too short, merge with next
                    if (duration < 5 || currentChunk.text.split(' ').length < 5) {
                        currentChunk.text += " " + item.text;
                        currentChunk.end = item.end;
                    } else {
                        mergedData.push(currentChunk);
                        currentChunk = { ...item };
                    }
                }
            }
            if (currentChunk) mergedData.push(currentChunk);

            // Assign IDs and initialize state tracking
            return mergedData.map((item, index) => ({
                id: index,
                start: item.start,
                end: item.end,
                text: item.text,
                score: null,
                isMistake: false,
                hintsUsed: 0
            }));
        }

            nextBtn: document.getElementById('next-btn'),
            playBtn: document.getElementById('play-btn'),
            playIcon: document.getElementById('play-icon'),
            repeatBtn: document.getElementById('repeat-btn'),
            dictationInput: document.getElementById('dictation-input'),
            checkBtn: document.getElementById('check-btn'),
            resultArea: document.getElementById('result-area'),
            diffOutput: document.getElementById('diff-output'),
            accuracyBadge: document.getElementById('accuracy-badge'),
            continueBtn: document.getElementById('continue-btn'),
            currentIndicator: document.getElementById('current-sentence-indicator'),
            progressBar: document.getElementById('progress-bar'),
            avgScore: document.getElementById('avg-score'),
            speedSelect: document.getElementById('speed-select'),
            hintBtn: document.getElementById('hint-btn'),
            showAnswerBtn: document.getElementById('show-answer-btn'),
            reviewToggle: document.getElementById('review-mode-toggle'),
            toggleVidBtn: document.getElementById('toggle-video-btn')
        };

        // Load YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: VIDEO_ID,
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'rel': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            DOM.loadingOverlay.classList.add('hidden');
            initApp();
        }

        function onPlayerError(event) {
            DOM.loadingText.innerHTML = "<span class='text-red-500'>Lỗi tải video. Video có thể đã bị chặn nhúng hoặc bị xóa.</span>";
            DOM.loadingText.nextElementSibling?.remove(); // remove spinner
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                DOM.playIcon.classList.replace('fa-play', 'fa-pause');
            } else {
                DOM.playIcon.classList.replace('fa-pause', 'fa-play');
            }
        }

        function playCurrentSegment() {
            if (!player || typeof player.seekTo !== 'function') return;
            
            const currentObj = sentences[activeList[currentSentenceIndex]];
            if (!currentObj) return;

            // Clear previous interval if exists
            if (checkPlaybackInterval) clearInterval(checkPlaybackInterval);

            // Pause if already playing segment
            if (isPlayingSegment && player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                isPlayingSegment = false;
                return;
            }

            isPlayingSegment = true;
            player.seekTo(currentObj.start, true);
            player.playVideo();
            
            // Apply speed
            player.setPlaybackRate(parseFloat(DOM.speedSelect.value));

            // Monitor playback to stop at 'end'
            checkPlaybackInterval = setInterval(() => {
                const currentTime = player.getCurrentTime();
                if (currentTime >= currentObj.end) {
                    player.pauseVideo();
                    clearInterval(checkPlaybackInterval);
                    isPlayingSegment = false;
                    DOM.dictationInput.focus();
                }
            }, 100);
        }

        function initApp() {
            renderSentenceList();
            updateUI();
            setupEventListeners();
        }

        function updateUI() {
            if (activeList.length === 0) {
                DOM.currentIndicator.innerText = "0 / 0";
                DOM.dictationInput.disabled = true;
                DOM.dictationInput.placeholder = "Không có câu nào trong danh sách ôn tập.";
                return;
            }

            DOM.dictationInput.disabled = false;
            const actualIndex = activeList[currentSentenceIndex];
            const currentObj = sentences[actualIndex];
            
            // Update Navigation
            DOM.currentIndicator.innerText = `${currentSentenceIndex + 1} / ${activeList.length}`;
            DOM.prevBtn.disabled = currentSentenceIndex === 0;
            DOM.nextBtn.disabled = currentSentenceIndex === activeList.length - 1;

            // Reset Workspace
            DOM.dictationInput.value = '';
            DOM.resultArea.classList.add('hidden');
            DOM.checkBtn.classList.remove('hidden');
            DOM.dictationInput.focus();
            DOM.dictationInput.placeholder = "Nhấn nút Play và gõ lại những gì bạn nghe được...";

            // Update List Selection
            document.querySelectorAll('.sentence-item').forEach(el => el.classList.remove('bg-blue-100', 'border-blue-400', 'border-l-4'));
            const activeEl = document.getElementById(`sentence-${actualIndex}`);
            if (activeEl) {
                activeEl.classList.add('bg-blue-100', 'border-blue-400', 'border-l-4');
                activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Update Progress
            updateProgress();
        }

        function renderSentenceList() {
            DOM.sentenceList.innerHTML = '';
            activeList.forEach((actualIndex, i) => {
                const obj = sentences[actualIndex];
                const div = document.createElement('div');
                div.id = `sentence-${actualIndex}`;
                div.className = `sentence-item p-3 mb-2 rounded border border-gray-200 bg-white cursor-pointer hover:bg-gray-50 transition-colors flex justify-between items-center`;
                
                let statusHtml = '';
                if (obj.score !== null) {
                    const color = obj.score >= 90 ? 'text-green-500' : (obj.score >= 50 ? 'text-yellow-500' : 'text-red-500');
                    statusHtml = `<span class="text-xs font-bold ${color}">${obj.score}%</span>`;
                }

                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold text-gray-600 shrink-0">${actualIndex + 1}</span>
                        <div class="text-sm font-medium text-gray-700 truncate w-32 ${obj.score !== null ? '' : 'blur-[4px] opacity-60'} select-none transition-all duration-500" title="${obj.score !== null ? obj.text : 'Chưa hoàn thành'}">
                            ${obj.text}
                        </div>
                    </div>
                    ${statusHtml}
                `;
                
                div.addEventListener('click', () => {
                    currentSentenceIndex = i;
                    updateUI();
                    playCurrentSegment();
                });
                
                DOM.sentenceList.appendChild(div);
            });
        }

        function updateProgress() {
            let attempted = 0;
            let totalScore = 0;
            
            sentences.forEach(s => {
                if (s.score !== null) {
                    attempted++;
                    totalScore += s.score;
                }
            });

            const progressPct = sentences.length > 0 ? (attempted / sentences.length) * 100 : 0;
            DOM.progressBar.style.width = `${progressPct}%`;

            if (attempted > 0) {
                DOM.avgScore.innerText = `${Math.round(totalScore / attempted)}%`;
            } else {
                DOM.avgScore.innerText = "0%";
            }
        }

        function checkAnswer() {
            const actualIndex = activeList[currentSentenceIndex];
            const currentObj = sentences[actualIndex];
            const userInput = DOM.dictationInput.value.trim();
            
            if(!userInput && userInput !== "") {
               // allow empty submit to see answer
            }

            // Cleanup function for comparison (remove punctuation, lowercase)
            const cleanString = (str) => {
                return str.toLowerCase().replace(/[^\w\s\']/g, '').split(/\s+/).filter(w => w.length > 0);
            };

            const expectedWords = cleanString(currentObj.text);
            const actualWords = cleanString(userInput);

            // Simple DP for Longest Common Subsequence (LCS) to align words
            const dp = Array(expectedWords.length + 1).fill(null).map(() => Array(actualWords.length + 1).fill(0));
            
            for (let i = 1; i <= expectedWords.length; i++) {
                for (let j = 1; j <= actualWords.length; j++) {
                    if (expectedWords[i - 1] === actualWords[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            // Backtrack to find alignment and generate diff
            let i = expectedWords.length;
            let j = actualWords.length;
            const path = [];

            while (i > 0 && j > 0) {
                if (expectedWords[i - 1] === actualWords[j - 1]) {
                    path.push({ type: 'match', word: expectedWords[i - 1] });
                    i--; j--;
                } else if (dp[i - 1][j] > dp[i][j - 1]) {
                    path.push({ type: 'missing', word: expectedWords[i - 1] });
                    i--;
                } else {
                    path.push({ type: 'extra', word: actualWords[j - 1] });
                    j--;
                }
            }
            while (i > 0) { path.push({ type: 'missing', word: expectedWords[i - 1] }); i--; }
            while (j > 0) { path.push({ type: 'extra', word: actualWords[j - 1] }); j--; }
            
            path.reverse();

            // Calculate score
            const correctCount = path.filter(p => p.type === 'match').length;
            const score = expectedWords.length > 0 ? Math.round((correctCount / expectedWords.length) * 100) : 0;
            
            currentObj.score = score;
            currentObj.isMistake = score < 100;

            // Generate HTML output
            let htmlOutput = "";
            let wordIndexExpected = 0;
            const originalWordsArray = currentObj.text.split(/\s+/); // Try to preserve original casing/punctuation for correct words where possible

            path.forEach(item => {
                if (item.type === 'match') {
                    // Find the original word that matches (heuristically)
                    let origWord = item.word;
                    if(originalWordsArray[wordIndexExpected] && cleanString(originalWordsArray[wordIndexExpected])[0] === item.word) {
                        origWord = originalWordsArray[wordIndexExpected];
                        wordIndexExpected++;
                    }
                    htmlOutput += `<span class="diff-correct">${origWord}</span> `;
                } else if (item.type === 'missing') {
                    htmlOutput += `<span class="diff-missing" title="Thiếu từ">${item.word}</span> `;
                    wordIndexExpected++;
                } else if (item.type === 'extra') {
                    htmlOutput += `<span class="diff-extra" title="Từ thừa">${item.word}</span> `;
                }
            });

            // Display results
            DOM.diffOutput.innerHTML = htmlOutput;
            DOM.accuracyBadge.innerText = `${score}%`;
            
            if(score === 100) {
                DOM.accuracyBadge.className = "px-3 py-1 text-sm font-bold rounded-full bg-green-100 text-green-700";
            } else if (score >= 50) {
                DOM.accuracyBadge.className = "px-3 py-1 text-sm font-bold rounded-full bg-yellow-100 text-yellow-700";
            } else {
                DOM.accuracyBadge.className = "px-3 py-1 text-sm font-bold rounded-full bg-red-100 text-red-700";
            }

            DOM.resultArea.classList.remove('hidden');
            DOM.checkBtn.classList.add('hidden');
            
            renderSentenceList(); // Re-render to unblur text and update score
            DOM.continueBtn.focus();
        }

        function provideHint() {
            const actualIndex = activeList[currentSentenceIndex];
            const currentObj = sentences[actualIndex];
            const expectedWords = currentObj.text.split(/\s+/);
            const currentInputWords = DOM.dictationInput.value.trim().split(/\s+/).filter(w=>w);
            
            // Simple logic: find first word that doesn't match roughly
            let errorIndex = -1;
            for(let i=0; i<expectedWords.length; i++) {
                const cleanExp = expectedWords[i].toLowerCase().replace(/[^\w\s\']/g, '');
                const cleanInp = (currentInputWords[i] || "").toLowerCase().replace(/[^\w\s\']/g, '');
                if (cleanExp !== cleanInp) {
                    errorIndex = i;
                    break;
                }
            }

            if (errorIndex !== -1) {
                const targetWord = expectedWords[errorIndex];
                let hintStr = "";
                
                currentObj.hintsUsed++;
                
                if (currentObj.hintsUsed % 2 === 1) {
                    // Level 1: First letter + blanks
                    hintStr = targetWord[0] + targetWord.substring(1).replace(/[a-zA-Z]/g, '_');
                } else {
                    // Level 2: Whole word
                    hintStr = targetWord;
                }
                
                // Reconstruct input up to error point
                let newInput = expectedWords.slice(0, errorIndex).join(" ");
                if(newInput) newInput += " ";
                newInput += hintStr + " ";
                
                DOM.dictationInput.value = newInput;
                DOM.dictationInput.focus();
            }
        }

        function setupEventListeners() {
            // Playback controls
            DOM.playBtn.addEventListener('click', playCurrentSegment);
            DOM.repeatBtn.addEventListener('click', () => {
                player.seekTo(sentences[activeList[currentSentenceIndex]].start, true);
                if (!isPlayingSegment) playCurrentSegment();
            });

            // Navigation
            DOM.prevBtn.addEventListener('click', () => {
                if (currentSentenceIndex > 0) { currentSentenceIndex--; updateUI(); playCurrentSegment(); }
            });
            DOM.nextBtn.addEventListener('click', () => {
                if (currentSentenceIndex < activeList.length - 1) { currentSentenceIndex++; updateUI(); playCurrentSegment(); }
            });
            DOM.continueBtn.addEventListener('click', () => {
                if (currentSentenceIndex < activeList.length - 1) { 
                    currentSentenceIndex++; 
                    updateUI(); 
                    playCurrentSegment(); 
                } else {
                    alert("Bạn đã hoàn thành danh sách!");
                }
            });

            // Dictation actions
            DOM.checkBtn.addEventListener('click', checkAnswer);
            DOM.hintBtn.addEventListener('click', provideHint);
            DOM.showAnswerBtn.addEventListener('click', () => {
                DOM.dictationInput.value = sentences[activeList[currentSentenceIndex]].text;
                checkAnswer(); // Auto check to show 100%
            });

            // Video Toggle
            DOM.toggleVidBtn.addEventListener('click', () => {
                if (DOM.videoWrapper.classList.contains('hidden')) {
                    DOM.videoWrapper.classList.remove('hidden');
                    DOM.toggleVidBtn.innerHTML = '<i class="fas fa-eye-slash mr-2"></i> <span>Ẩn video</span>';
                } else {
                    DOM.videoWrapper.classList.add('hidden');
                    DOM.toggleVidBtn.innerHTML = '<i class="fas fa-eye mr-2"></i> <span>Hiện video</span>';
                }
            });

            // Speed change
            DOM.speedSelect.addEventListener('change', () => {
                if (player && typeof player.setPlaybackRate === 'function') {
                    player.setPlaybackRate(parseFloat(DOM.speedSelect.value));
                }
            });

            // Review Mode Toggle
            DOM.reviewToggle.addEventListener('change', (e) => {
                reviewMode = e.target.checked;
                if (reviewMode) {
                    activeList = sentences.map((s, i) => s.isMistake ? i : -1).filter(i => i !== -1);
                } else {
                    activeList = [...Array(sentences.length).keys()];
                }
                currentSentenceIndex = 0;
                renderSentenceList();
                updateUI();
            });

            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                // Ctrl + Space: Play/Pause/Repeat
                if (e.ctrlKey && e.code === 'Space') {
                    e.preventDefault();
                    playCurrentSegment();
                }
                // Ctrl + Enter: Check
                if (e.ctrlKey && e.code === 'Enter') {
                    e.preventDefault();
                    if (!DOM.resultArea.classList.contains('hidden')) {
                         DOM.continueBtn.click();
                    } else {
                         checkAnswer();
                    }
                }
                // Ctrl + H: Hint
                if (e.ctrlKey && e.key.toLowerCase() === 'h') {
                    e.preventDefault();
                    provideHint();
                }
                // Ctrl + Arrow Left/Right: Nav
                if (e.ctrlKey && e.key === 'ArrowLeft') {
                    e.preventDefault();
                    DOM.prevBtn.click();
                }
                if (e.ctrlKey && e.key === 'ArrowRight') {
                    e.preventDefault();
                    DOM.nextBtn.click();
                }
            });
        }
    </script>
</body>
</html>
